spring.application.name=nordeste-api

# Conexão JDBC com o PostgreSQL (forçando TCP/IP local na porta 5432)
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/raizes_nordeste
spring.datasource.username=raizesnordeste
spring.datasource.password=12345

# Configuração do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080
